[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beebium-wfsinit-tests"
version = "0.1.0"
description = "WFSINIT diagnostic integration tests for the Beebium BBC Micro emulator"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
dependencies = [
    "beebium",
    "grpcio>=1.60.0",
    "protobuf>=4.0.0",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    # `disc` CLI builds the blank 20MB ADFS hard disc image for the SCSI
    # fixture on demand; declaring it here puts `disc` on PATH under `uv run`.
    "oaknut-disc>=11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wfsinit_test_support"]

[tool.uv.sources]
beebium = { path = "../../clients/beebium-python-client", editable = true }

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests requiring external resources (ROMs, disc images)",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
