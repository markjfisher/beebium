[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beebium-dfs-writeback-tests"
version = "0.1.0"
description = "DFS disc write-back / flush integration tests for the Beebium BBC Micro emulator"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
dependencies = [
    "beebium",
    "oaknut-dfs",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.uv.sources]
beebium = { path = "../../clients/beebium-python-client", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
