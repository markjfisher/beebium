[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beebium"
version = "0.1.0"
description = "Python client for the Beebium BBC Micro emulator"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Emulators",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "stevedore>=5.0.0",
]

# Runtime-optional features are published extras (installable by end users).
# Development tooling lives in dependency-groups (below), NOT in extras, so it
# is never published in the wheel's metadata -- `pip install beebium[...]` only
# ever pulls real runtime features.
[project.optional-dependencies]
imaging = [
    "Pillow>=10.0.0",
]
discovery = [
    "zeroconf>=0.131.0",
]

# PEP 735 dependency-groups: local development tooling, kept out of published
# metadata. `uv run`/`uv sync` install the `dev` group by default. The `test`
# group is split out so the wheel-packaging harness (scripts/test-wheel.sh) can
# `uv export --only-group test` to install just the test runner into the fresh
# venv alongside the built wheel -- no codegen tooling needed there.
[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]
dev = [
    { include-group = "test" },
    "grpcio-tools>=1.60.0",
]

[project.entry-points.pytest11]
beebium = "beebium.pytest_plugin"

# First-party extension client adapters. The key is the server manifest name
# (kebab-case); the value points at the concrete ExtensionAdapter subclass.
# Third-party extension distributions register into this same group to have
# their adapters discovered with no change to the core.
[project.entry-points."beebium.ext"]
aun = "beebium.aun:Aun"
piconet = "beebium.piconet:Piconet"
rpc-serial = "beebium.rpc_serial:RpcSerial"
host-serial = "beebium.host_serial:HostSerial"
acorn-rtc = "beebium.acorn_rtc:AcornRtc"
acorn-scsi = "beebium.acorn_scsi:AcornScsi"

[project.urls]
Homepage = "https://github.com/rob-smallshire/beebium"
Repository = "https://github.com/rob-smallshire/beebium"

[tool.hatch.build.targets.wheel]
packages = ["src/beebium"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
