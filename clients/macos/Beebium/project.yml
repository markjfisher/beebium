name: Beebium
options:
  bundleIdPrefix: com.beebium
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  grpc-swift:
    url: https://github.com/grpc/grpc-swift
    from: "1.23.0"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
  swift-atomics:
    url: https://github.com/apple/swift-atomics
    from: "1.2.0"

targets:
  Beebium:
    type: application
    platform: macOS
    sources:
      - path: Beebium
        excludes:
          - "**/*.xcassets"
          - Resources/KeyboardMappings
      - path: Beebium/Assets.xcassets
      - path: Beebium/Resources/KeyboardMappings
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.Beebium
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: grpc-swift
        product: GRPC
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: swift-atomics
        product: Atomics
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFAudio.framework
    postBuildScripts:
      - name: "Embed Server Executables, Presets, and ROMs"
        script: |
          # Copy server executables to Frameworks (if BEEBIUM_SERVERS_BUILD_DIR is set)
          SERVERS_DIR="${BEEBIUM_SERVERS_BUILD_DIR:-}"
          if [ -n "$SERVERS_DIR" ] && [ -d "$SERVERS_DIR" ]; then
            echo "Embedding servers from: $SERVERS_DIR"
            mkdir -p "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
            for server in beebium-model-b beebium-model-b-plus beebium-model-b-romram; do
              if [ -f "$SERVERS_DIR/$server" ]; then
                cp "$SERVERS_DIR/$server" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
                echo "  Copied $server"
              fi
            done

            # Copy presets and thumbnails to Resources
            if [ -d "$SERVERS_DIR/presets" ]; then
              mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/presets"
              cp "$SERVERS_DIR/presets/"*.preset.beebium "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/presets/" 2>/dev/null || true
              cp "$SERVERS_DIR/presets/"*.thumbnail.png "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/presets/" 2>/dev/null || true
              echo "  Copied presets and thumbnails"
            fi
          else
            echo "BEEBIUM_SERVERS_BUILD_DIR not set or directory does not exist, skipping server embedding"
          fi

          # Copy ROMs (if BEEBIUM_ROMS_DIR is set, otherwise try repo default relative to SRCROOT)
          ROMS_DIR="${BEEBIUM_ROMS_DIR:-${SRCROOT}/../../../roms}"
          if [ -d "$ROMS_DIR" ]; then
            echo "Embedding ROMs from: $ROMS_DIR"
            mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms"
            cp "$ROMS_DIR/"*.rom "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms/" 2>/dev/null || true
            echo "  Copied ROMs"
          else
            echo "ROMs directory not found at $ROMS_DIR, skipping ROM embedding"
          fi

  BeebiumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeebiumTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.BeebiumTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Beebium
