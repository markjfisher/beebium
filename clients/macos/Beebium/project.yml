name: Beebium
options:
  bundleIdPrefix: com.beebium
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  grpc-swift:
    url: https://github.com/grpc/grpc-swift
    from: "1.23.0"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.0"
  swift-atomics:
    url: https://github.com/apple/swift-atomics
    from: "1.2.0"

targets:
  Beebium:
    type: application
    platform: macOS
    sources:
      - path: Beebium
        excludes:
          - "**/*.xcassets"
          - Resources/KeyboardMappings
      - path: Beebium/Assets.xcassets
      - path: Beebium/Resources/KeyboardMappings
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.Beebium
        INFOPLIST_GENERATION_MODE: GeneratedFile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: grpc-swift
        product: GRPC
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: swift-atomics
        product: Atomics
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFAudio.framework
    postBuildScripts:
      - name: "Embed Server Executables, Presets, and ROMs"
        script: |
          # Embed the headless server executables, their plugin tree, and
          # their native dependencies under Contents/Resources/servers/ (if
          # BEEBIUM_SERVERS_BUILD_DIR is set). They live in Resources rather
          # than Frameworks because the plugin tree carries non-code files
          # (manifest.json) that codesign rejects in Frameworks, which it
          # validates as code-only. The Swift side resolves this directory
          # via Bundle.main.resourcePath (PresetManager.serversDirpath).
          SERVERS_DIR="${BEEBIUM_SERVERS_BUILD_DIR:-}"
          if [ -n "$SERVERS_DIR" ] && [ -d "$SERVERS_DIR" ]; then
            echo "Embedding servers from: $SERVERS_DIR"
            SERVERS_DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/servers"
            # Rebuild from scratch each time so stale bundled dylibs from a
            # previous build don't accumulate.
            rm -rf "$SERVERS_DEST"
            mkdir -p "$SERVERS_DEST"
            for server in beebium-model-b beebium-model-b-plus beebium-model-b-plus-128k beebium-model-b-romram; do
              if [ -f "$SERVERS_DIR/$server" ]; then
                cp "$SERVERS_DIR/$server" "$SERVERS_DEST/"
                echo "  Copied $server"
              fi
            done

            # Copy presets and thumbnails alongside the embedded servers
            # (Resources/servers/presets/), matching what the server
            # binary expects: PresetPaths::get_system_presets_dirpath()
            # looks for a sibling 'presets/' directory next to the
            # executable. Placing them in Resources/presets/ instead -
            # which we did before - made create-preset's --from fail to
            # resolve any system preset by ID.
            if [ -d "$SERVERS_DIR/presets" ]; then
              mkdir -p "${SERVERS_DEST}/presets"
              cp "$SERVERS_DIR/presets/"*.preset.beebium "${SERVERS_DEST}/presets/" 2>/dev/null || true
              cp "$SERVERS_DIR/presets/"*.thumbnail.png "${SERVERS_DEST}/presets/" 2>/dev/null || true
              echo "  Copied presets and thumbnails to ${SERVERS_DEST}/presets"
            fi

            # Copy the extension plugin tree next to the embedded servers.
            # The server resolves plugins from <exe-dir>/extensions/. Without
            # this, only built-in transports (AUN) load from the packaged
            # app; plugin transports like Piconet would be silently absent.
            if [ -d "$SERVERS_DIR/extensions" ]; then
              cp -R "$SERVERS_DIR/extensions" "$SERVERS_DEST/extensions"
              echo "  Copied extension plugin tree"
            fi

            # Make the embedded servers and plugins self-contained: bundle
            # their internal shared libraries and Homebrew dependencies
            # (gRPC/protobuf/abseil) alongside them, rewrite install names to
            # @rpath, and re-sign. Without this the app only runs on the
            # build machine (deps reference the dev tree + /opt/homebrew).
            # See docs/macos-app-packaging.md.
            echo "  Bundling native dependencies into the app..."
            # The dynamic-triplet macOS server links gRPC/protobuf/abseil as
            # shared dylibs shipped in the artifact's lib/ (sibling of
            # src/server). The server binaries' baked rpath points at the CI
            # build tree, which does not exist here, so point the bundler at the
            # shipped lib/ directory where the actual dylibs live.
            SERVERS_LIBDIR="$SERVERS_DIR/../../lib"
            if [ -d "$SERVERS_LIBDIR" ]; then
              /usr/bin/env python3 "${SRCROOT}/scripts/bundle_dependencies.py" \
                "$SERVERS_DEST" --search-dir "$SERVERS_LIBDIR"
            else
              /usr/bin/env python3 "${SRCROOT}/scripts/bundle_dependencies.py" \
                "$SERVERS_DEST"
            fi
          else
            echo "BEEBIUM_SERVERS_BUILD_DIR not set or directory does not exist, skipping server embedding"
          fi

          # Copy ROMs (if BEEBIUM_ROMS_DIR is set, otherwise try repo default relative to SRCROOT)
          ROMS_DIR="${BEEBIUM_ROMS_DIR:-${SRCROOT}/../../../roms}"
          if [ -d "$ROMS_DIR" ]; then
            echo "Embedding ROMs from: $ROMS_DIR"
            mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms"
            cp "$ROMS_DIR/"*.rom "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/roms/" 2>/dev/null || true
            echo "  Copied ROMs"
          else
            echo "ROMs directory not found at $ROMS_DIR, skipping ROM embedding"
          fi

  BeebiumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeebiumTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebium.BeebiumTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: Beebium
