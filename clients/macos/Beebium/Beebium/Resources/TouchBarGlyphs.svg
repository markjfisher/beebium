<?xml version="1.0" encoding="utf-8"?>
<!--
  TouchBar Glyphs for BeebEm Function Keys (f0-f9)

  Most of the BBC Micro keycaps use a famous font called Gorton; however, the function keys do not,
  at least not in an obvious way. Notably, the digit one in f1 is not the Gorton 1, and the digit
  zero in f0 is more akin to a Scandinavian letter ø than to a zero with a diagonal (the slash
  extends beyond the ring). This file contains hand drawn glyphs based on photographs of a real BBC
  Micro keyboard, with digits 2 to 9 inclusive based on the Gorton font. Finally, the italicised "f"
  glyphs aren't from Gorton; their origin is opaque.

  Originally drawn in Boxy SVG.

  STRUCTURE REQUIREMENTS:
  - Each glyph must be contained in a <g> element with an id attribute (e.g., id="f0", id="f1", etc.)
  - The group id is used as the lookup key when rendering glyphs in BeebEm
  - Each group should contain one or more <path> elements that define the visual appearance

  SUPPORTED SVG FEATURES (Parser Limitations):
  The BeebEm SVG parser is intentionally simple and lightweight to avoid large dependencies.
  It supports only a minimal subset of SVG:

  Supported:
  - <g> elements with id attributes (required for glyph identification)
  - <path> elements with d attribute containing path data
  - Path commands: M (moveto), L (lineto), C (cubic bezier), Z (closepath)
  - Style attributes as inline CSS (style="property: value; property: value")
  - CSS properties: stroke-width (with or without 'px' suffix), fill (value or 'none')
  - Coordinate values as decimal numbers

  NOT Supported:
  - Advanced path commands (relative commands, arcs, quadratic beziers, etc.)
  - Gradients, patterns, filters, masks
  - Transformations in path data
  - External stylesheets or <style> elements
  - Text elements
  - Embedded images or foreign objects
  - XLINK references
  - SVG animations
  - Most presentational attributes as separate XML attributes (use style="" instead)

  RECOMMENDATIONS:
  - Keep glyphs simple and use basic path commands only
  - Specify styles inline using style="..." attributes
  - Test any modifications by running BeebEm to ensure glyphs render correctly
  - Each glyph should fit within a 100x100 viewBox for consistent scaling
  - The parser ignores unknown elements and attributes (e.g., <rect>, <defs>, guides)

  For implementation details, see BeebSvgGlyphRenderer.swift
-->
