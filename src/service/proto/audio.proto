syntax = "proto3";

package beebium;

// Audio streaming service
// Note: Sound chip state introspection moved to DebuggerControl.GetSoundChipState
service AudioService {
    // Stream audio samples as they're generated
    rpc SubscribeAudio(SubscribeAudioRequest) returns (stream AudioChunk);

    // Get audio format metadata (how to interpret sample data)
    rpc GetAudioFormat(GetAudioFormatRequest) returns (AudioFormat);
}

message SubscribeAudioRequest {
    uint32 chunk_size = 1;  // Samples per chunk (default: 1024)
}

message AudioChunk {
    uint64 sequence = 1;        // Chunk sequence number (for drop detection)
    uint32 sample_count = 2;    // Number of samples in this chunk
    uint64 cycle_count = 3;     // Emulation cycle at start of chunk (reserved)

    // Packed sample data: sample_count × source_count × 4 bytes
    // Each sample is N × 32-bit fields, where N = source_count from AudioFormat
    // Use GetAudioFormat to determine how to interpret each 32-bit field
    bytes samples = 4;
}

// Describes how to interpret a 32-bit source field
enum SourceEncoding {
    ENCODING_4X8BIT_SIGNED = 0;   // 4 × int8 channels, zero-centered (legacy)
    ENCODING_2X16BIT_SIGNED = 1;  // 2 × int16 channels (e.g., Music 5000 stereo)
    ENCODING_1X32BIT_SIGNED = 2;  // 1 × int32 channel (high-quality)
    ENCODING_SILENCE = 3;         // Unused/silent source
    ENCODING_4X8BIT_UNSIGNED = 4; // 4 × uint8 channels, DC bias pre-applied (SN76489)
}

message AudioSource {
    uint32 source_index = 1;      // Index into sample sources array
    string source_name = 2;       // E.g., "SN76489", "Speech", "Music5000"
    SourceEncoding encoding = 3;  // How the 32-bit field is subdivided
    // Sub-channel labels using MOS SOUND channel numbering:
    // "0" (noise), "1", "2", "3" (tones) - matches BBC BASIC SOUND command
    repeated string channel_names = 4;
    uint32 group_id = 5;          // Channel group ID (0 = ungrouped)
}

// Channel group for organizing related audio sources in UI
message ChannelGroup {
    uint32 group_id = 1;          // Unique group identifier
    string group_name = 2;        // E.g., "Internal Sound", "Music 5000"
    string description = 3;       // Optional description
    string color = 4;             // Optional UI hint (e.g., "#FF5733")
}

message GetAudioFormatRequest {}

message AudioFormat {
    uint32 sample_rate = 1;       // Output sample rate (48000 Hz)
    uint32 source_count = 2;      // Number of 32-bit fields per sample
    repeated AudioSource sources = 3;     // Metadata for each active source
    repeated ChannelGroup groups = 4;     // Channel group definitions
}

// Note: GetChannelStates moved to DebuggerControl.GetSoundChipState in debugger.proto
