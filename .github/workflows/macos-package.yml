# Build, install, test and audit the beebium-server Homebrew formula on macOS.
#
# The formula is a source build against Homebrew's own grpc/protobuf/abseil, so
# this is cheap (~1 min per runner) -- it runs on PRs that touch the formula or
# the build system, on demand, and as a reusable job in the release flow.
#
# Covers both architectures: macos-14 is arm64 (Apple Silicon), macos-13 is
# x86_64 (Intel).

name: macOS package

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "packaging/homebrew/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/server/CMakeLists.txt"
      - ".github/workflows/macos-package.yml"

permissions:
  contents: read

jobs:
  # arm64 only. The Intel macos-13 runner is being deprecated and is so
  # runner-constrained that the job often never gets picked up, which would block
  # releases indefinitely (a reusable-workflow leg that never completes blocks the
  # dependent release job). The formula is a source build, so it still works on
  # Intel Macs for users; we just validate the formula logic on arm64.
  formula:
    name: formula (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install, test and audit the formula
        run: packaging/homebrew/test-formula.sh
