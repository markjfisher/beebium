name: CI

on:
  push:
  pull_request:

jobs:
  server-macos:
    name: Build and Test Server (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake grpc protobuf

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  server-linux:
    name: Build and Test Server (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server/beebium-model-b
          retention-days: 1

  server-windows:
    name: Build and Test Server (Windows)
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d332a018c433fad20822ff4b536e4ccdc3413bd'

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DBEEBIUM_BUILD_TESTS=ON `
            -DBEEBIUM_BUILD_SERVICE=ON `
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release/beebium-model-b.exe
          retention-days: 1

  gui-client-macos:
    name: Build and Test GUI Client (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      - name: Build client
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS' \
            -configuration Release \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run client tests
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild test \
            -scheme BeebiumTests \
            -destination 'platform=macOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  python-client:
    name: Test Python Client (Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        working-directory: clients/python
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration:
    name: Test Python Client (Integration Tests)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-windows:
    name: Test Python Client (Integration Tests - Windows)
    runs-on: windows-latest
    needs: server-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/Release/beebium-model-b.exe
        run: uv run --with pytest python -m pytest tests/ -v
