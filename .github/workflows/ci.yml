name: CI

on:
  push:
  pull_request:
  schedule:
    # Run weekly on Monday at 6 AM UTC to keep caches alive (7-day expiry)
    - cron: '0 6 * * 1'

jobs:
  server-macos-arm64:
    name: Build and Test Server (macOS arm64)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install dependencies
        run: |
          brew install cmake grpc protobuf

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binaries and presets
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-model-b-plus
            build/src/server/beebium-model-b-romram
            build/src/server/presets/
          retention-days: 7

  server-macos-x86_64:
    name: Build and Test Server (macOS x86_64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install dependencies
        run: |
          brew install cmake grpc protobuf

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binaries and presets
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-model-b-plus
            build/src/server/beebium-model-b-romram
            build/src/server/presets/
          retention-days: 7

  server-linux:
    name: Build and Test Server (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server/beebium-model-b
          retention-days: 7

  server-windows:
    name: Build and Test Server (Windows)
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VCPKG_INSTALLED_DIR
        run: echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> $env:GITHUB_ENV

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      - name: Setup vcpkg and install dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d332a018c433fad20822ff4b536e4ccdc3413bd'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}" `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DBEEBIUM_BUILD_TESTS=ON `
            -DBEEBIUM_BUILD_SERVICE=ON `
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check executable dependencies
        run: dumpbin /dependents build\src\server\Release\beebium-model-b.exe

      - name: Copy runtime DLLs to Release folder
        run: |
          Copy-Item "$env:VCPKG_INSTALLED_DIR\x64-windows\bin\*.dll" -Destination "build\src\server\Release\" -Force

      - name: Upload server binary with DLLs
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release/
          retention-days: 7

  gui-client-macos-arm64:
    name: Build and Test GUI Client (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: server-build

      - name: Make servers executable
        run: chmod +x server-build/beebium-model-b*

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      - name: Build client with embedded servers
        working-directory: clients/macos/Beebium
        env:
          BEEBIUM_SERVERS_BUILD_DIR: ${{ github.workspace }}/server-build
          BEEBIUM_ROMS_DIR: ${{ github.workspace }}/roms
        run: |
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run client tests
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild test \
            -scheme BeebiumTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Beebium.app
        uses: actions/upload-artifact@v4
        with:
          name: Beebium-macos-arm64
          path: clients/macos/Beebium/build/Build/Products/Release/Beebium.app
          retention-days: 7

  gui-client-macos-x86_64:
    name: Build and Test GUI Client (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: server-build

      - name: Make servers executable
        run: chmod +x server-build/beebium-model-b*

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      - name: Build client with embedded servers
        working-directory: clients/macos/Beebium
        env:
          BEEBIUM_SERVERS_BUILD_DIR: ${{ github.workspace }}/server-build
          BEEBIUM_ROMS_DIR: ${{ github.workspace }}/roms
        run: |
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS,arch=x86_64' \
            -configuration Release \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run client tests
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild test \
            -scheme BeebiumTests \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Beebium.app
        uses: actions/upload-artifact@v4
        with:
          name: Beebium-macos-x86_64
          path: clients/macos/Beebium/build/Build/Products/Release/Beebium.app
          retention-days: 7

  python-client:
    name: Python Client Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        working-directory: clients/python
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-linux:
    name: Python Client Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-windows:
    name: Python Client Integration Tests (Windows)
    runs-on: windows-latest
    needs: server-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/Release/beebium-model-b.exe
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-macos-arm64:
    name: Python Client Integration Tests (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: brew install grpc

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-macos-x86_64:
    name: Python Client Integration Tests (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: brew install grpc

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
        run: uv run --with pytest python -m pytest tests/ -v
