      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        # --durations=0 lists every test's wall-clock time (slowest first) so we
        # have data on which integration tests are genuinely long; --timeout=600
        # fails a hung test after 10 min rather than stalling the job.
        run: uv run --with pytest --with pytest-timeout python -m pytest tests/ -v --durations=0 --timeout=600

  python-integration-windows:
