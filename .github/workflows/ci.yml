name: CI

on:
  push:
  pull_request:
  schedule:
    # Run weekly on Monday at 6 AM UTC to keep caches alive (7-day expiry)
    - cron: '0 6 * * 1'

jobs:
  server-macos-arm64:
    name: Build and Test Server (macOS arm64)
    runs-on: macos-14

    env:
      VCPKG_DEFAULT_TRIPLET: arm64-osx-static
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Set VCPKG_INSTALLED_DIR
        run: echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> $GITHUB_ENV

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-arm64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-static-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d332a018c433fad20822ff4b536e4ccdc3413bd'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="${VCPKG_INSTALLED_DIR}" \
            -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/triplets" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-static \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify static linking
        run: |
          echo "Checking dynamic dependencies..."
          otool -L build/src/server/beebium-model-b
          # Should only show system libraries, not Homebrew paths

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binaries and presets
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-model-b-plus
            build/src/server/beebium-model-b-romram
            build/src/server/beebium-tube-65C02-3MHz
            build/src/server/presets/
          retention-days: 7

  server-macos-x86_64:
    name: Build and Test Server (macOS x86_64)
    runs-on: macos-15-intel

    env:
      VCPKG_DEFAULT_TRIPLET: x64-osx-static
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Set VCPKG_INSTALLED_DIR
        run: echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> $GITHUB_ENV

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-static-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d332a018c433fad20822ff4b536e4ccdc3413bd'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="${VCPKG_INSTALLED_DIR}" \
            -DVCPKG_OVERLAY_TRIPLETS="${GITHUB_WORKSPACE}/triplets" \
            -DVCPKG_TARGET_TRIPLET=x64-osx-static \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify static linking
        run: |
          echo "Checking dynamic dependencies..."
          otool -L build/src/server/beebium-model-b
          # Should only show system libraries, not Homebrew paths

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binaries and presets
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-model-b-plus
            build/src/server/beebium-model-b-romram
            build/src/server/beebium-tube-65C02-3MHz
            build/src/server/presets/
          retention-days: 7

  server-linux:
    name: Build and Test Server (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc uuid-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEEBIUM_BUILD_TESTS=ON \
            -DBEEBIUM_BUILD_SERVICE=ON \
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-linux
          path: |
            build/src/server/beebium-model-b
            build/src/server/beebium-tube-65C02-3MHz
          retention-days: 7

  server-windows:
    name: Build and Test Server (Windows)
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VCPKG_INSTALLED_DIR
        run: echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed" >> $env:GITHUB_ENV

      - name: Configure vcpkg NuGet binary cache
        run: |
          nuget sources add -Name "GitHub" -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.actor }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          echo "VCPKG_BINARY_SOURCES=clear;nuget,GitHub,readwrite" >> $env:GITHUB_ENV

      - name: Setup vcpkg and install dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d332a018c433fad20822ff4b536e4ccdc3413bd'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="${env:VCPKG_INSTALLED_DIR}" `
            -DVCPKG_MANIFEST_INSTALL=OFF `
            -DBEEBIUM_BUILD_TESTS=ON `
            -DBEEBIUM_BUILD_SERVICE=ON `
            -DBEEBIUM_BUILD_SERVER=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check executable dependencies
        run: dumpbin /dependents build\src\server\Release\beebium-model-b.exe

      - name: Copy runtime DLLs to Release folder
        run: |
          Copy-Item "$env:VCPKG_INSTALLED_DIR\x64-windows\bin\*.dll" -Destination "build\src\server\Release\" -Force

      - name: Upload server binary with DLLs
        uses: actions/upload-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release/
          retention-days: 7

  gui-client-macos-arm64:

    name: Build and Test GUI Client (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: server-build

      - name: Make servers executable
        run: chmod +x server-build/beebium-model-b* server-build/beebium-tube-*

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      - name: Build client with embedded servers
        working-directory: clients/macos/Beebium
        env:
          BEEBIUM_SERVERS_BUILD_DIR: ${{ github.workspace }}/server-build
          BEEBIUM_ROMS_DIR: ${{ github.workspace }}/roms
        run: |
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run client tests
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild test \
            -scheme BeebiumTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Beebium.app
        uses: actions/upload-artifact@v4
        with:
          name: Beebium-macos-arm64
          path: clients/macos/Beebium/build/Build/Products/Release/Beebium.app
          retention-days: 7

  gui-client-macos-x86_64:

    name: Build and Test GUI Client (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: server-build

      - name: Make servers executable
        run: chmod +x server-build/beebium-model-b* server-build/beebium-tube-*

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/macos/Beebium
        run: xcodegen generate

      - name: Build client with embedded servers
        working-directory: clients/macos/Beebium
        env:
          BEEBIUM_SERVERS_BUILD_DIR: ${{ github.workspace }}/server-build
          BEEBIUM_ROMS_DIR: ${{ github.workspace }}/roms
        run: |
          xcodebuild build \
            -scheme Beebium \
            -destination 'platform=macOS,arch=x86_64' \
            -configuration Release \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run client tests
        working-directory: clients/macos/Beebium
        run: |
          xcodebuild test \
            -scheme BeebiumTests \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Beebium.app
        uses: actions/upload-artifact@v4
        with:
          name: Beebium-macos-x86_64
          path: clients/macos/Beebium/build/Build/Products/Release/Beebium.app
          retention-days: 7

  typescript-client:

    name: TypeScript Client Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Type-check
        working-directory: clients/typescript
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: clients/typescript
        run: npm run test:unit

  typescript-integration-linux:
    name: TypeScript Client Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev protobuf-compiler

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Run integration tests
        working-directory: clients/typescript
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/tests/assets/roms
        run: npm run test:integration

  typescript-integration-macos-arm64:
    name: TypeScript Client Integration Tests (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        run: brew install protobuf

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Run integration tests
        working-directory: clients/typescript
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/tests/assets/roms
        run: npm run test:integration

  typescript-integration-macos-x86_64:
    name: TypeScript Client Integration Tests (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: build/src/server

      - name: Make server executable
        run: chmod +x build/src/server/beebium-model-b

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        run: brew install protobuf

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Run integration tests
        working-directory: clients/typescript
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/tests/assets/roms
        run: npm run test:integration

  python-client:

    name: Python Client Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        working-directory: clients/python
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-linux:
    name: Python Client Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-linux
          path: build/src/server

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b build/src/server/beebium-tube-65C02-3MHz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-windows:
    name: Python Client Integration Tests (Windows)
    runs-on: windows-latest
    needs: server-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-windows
          path: build/src/server/Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/Release/beebium-model-b.exe
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-macos-arm64:
    name: Python Client Integration Tests (macOS arm64)
    runs-on: macos-14
    needs: server-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-arm64
          path: build/src/server

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b build/src/server/beebium-tube-*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run integration tests
        working-directory: clients/python
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/roms
        run: uv run --with pytest python -m pytest tests/ -v

  python-integration-macos-x86_64:
    name: Python Client Integration Tests (macOS x86_64)
    runs-on: macos-15-intel
    needs: server-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-macos-x86_64
          path: build/src/server

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b build/src/server/beebium-tube-*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
