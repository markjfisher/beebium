  typescript-client:

    name: TypeScript Client Unit Tests
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Type-check
        working-directory: clients/typescript
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: clients/typescript
        run: npm run test:unit

  typescript-integration-linux:
    name: TypeScript Client Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: server-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gRPC runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgrpc++-dev protobuf-compiler

      # Extract at 'build/' so the artifact's src/server/ and lib/
      # entries land in the same relative layout the server's build-time
      # RPATH expects (see build/lib/libbeebium_extension_api.so).
      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: beebium-server-linux
          path: build

      - name: Make servers executable
        run: chmod +x build/src/server/beebium-model-b
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Generate proto stubs
        working-directory: clients/typescript
        run: npm run generate-protos

      - name: Run integration tests
        working-directory: clients/typescript
        env:
          BEEBIUM_SERVER: ${{ github.workspace }}/build/src/server/beebium-model-b
          BEEBIUM_ROM_DIR: ${{ github.workspace }}/tests/assets/roms
        run: npm run test:integration

