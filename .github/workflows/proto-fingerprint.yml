# Verify the committed protocol-fingerprint constants are in sync with the
# protos. Runs only when the protos, the generated constants, or the fingerprint
# tooling change, so it stays quiet otherwise. If this fails, a proto was changed
# without regenerating the fingerprint: run
#   python scripts/sync_protocol_fingerprint.py
# (after regenerating the proto stubs) and commit the result.

name: Protocol fingerprint

on:
  push:
    paths:
      - "src/**/*.proto"
      - "src/service/include/beebium/service/ProtocolFingerprint.hpp"
      - "clients/python/src/beebium/_proto/protocol_fingerprint.py"
      - "clients/typescript/src/generated/protocol_fingerprint.ts"
      - "scripts/protocol_fingerprint.py"
      - "scripts/sync_protocol_fingerprint.py"
      - ".github/workflows/proto-fingerprint.yml"
  pull_request:
    paths:
      - "src/**/*.proto"
      - "src/service/include/beebium/service/ProtocolFingerprint.hpp"
      - "clients/python/src/beebium/_proto/protocol_fingerprint.py"
      - "clients/typescript/src/generated/protocol_fingerprint.ts"
      - "scripts/protocol_fingerprint.py"
      - "scripts/sync_protocol_fingerprint.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protoc tooling
        run: pip install grpcio-tools
      - name: Verify fingerprint constants are in sync
        run: python scripts/sync_protocol_fingerprint.py --check
